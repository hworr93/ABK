name: Android Kernel Build - Custom

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ============= Kernel version configuration ==============
      android_version:
        description: "Android Version"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android12
      kernel_version:
        description: "kernel version"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      sub_level:
        description: "Sub-version number (like 66, 198, X)"
        required: true
        type: string
        default: "66"
      os_patch_level:
        description: "Security Patch Level (like 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"
      revision:
        description: "Revised version (like r11, only 5.10 need)"
        required: false
        type: string
        default: "r11"

      # ==================== KernelSU Configuration ====================
      kernelsu_variant:
        description: "KernelSU variants"
        required: true
        type: choice
        options:
          - None
          - Official
          - SukiSU
          - ReSukiSU
        default: ReSukiSU
      kernelsu_branch:
        description: "KSU Branch"
        required: true
        type: choice
        options:
          - Stable
          - Dev
          - Latest
          - Custom
        default: Stable

      # ==================== Optional Configuration ====================
      custom_ref:
        description: "Custom reference (used only when KSU Branch is 'Custom')"
        required: false
        type: string
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (optional, N or leave empty = current UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== Virtualization Support Configuration ====================
      virtualization_support:
        description: "Virtualization support (5.10~6.6: slot patch, 6.12: on/off)"
        required: false
        type: choice
        options:
          - "off"
          - "on"
          - "678"
          - "123"
          - "345"
        default: "off"

      # ==================== Feature Toggles ====================
      use_zram:
        description: "Enable ZRAM enhancement algorithm"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG anti-bricking"
        required: true
        type: boolean
        default: false
      use_ddk:
        description: "Enable DDK anti-bricking LSM"
        required: true
        type: boolean
        default: false
      use_ntsync:
        description: "Enable NTsync"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "Enable Networking Enhancements (IPSet + BBR)"
        required: false
        type: boolean
        default: false
      use_kpm:
        description: "Enable KPM feature"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "Disable SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "Enable OnePlus 8E support"
        required: false
        type: boolean
        default: false

      # ==================== ZRAM Extension Options ====================
      zram_full_algo:
        description: "Enable ZRAM full algorithm support (6.12 automatically skips legacy LZ4K/LZ4KD/LZ4K_OPLUS)"
        required: false
        type: boolean
        default: false
      zram_extra_algos:
        description: "Custom ZRAM algorithms (comma separated, e.g., lzo,lz4,deflate,zstd; 6.12 will ignore lz4k/lz4kd/lz4k_oplus)"
        required: false
        type: string
        default: ""

      # ==================== KPM Extension Options ====================
      kpm_password:
        description: "Custom KPM super password (leave empty = use default password)"
        required: false
        type: string
        default: ""

      # ==================== Custom External Modules ====================
      custom_external_modules:
        description: "Custom external modules (compatible with old repo;stage, also supports module:repo;stage and set:repo#child;stage, separated by |)"
        required: false
        type: string
        default: ""
      custom_kernel_options:
        description: "Custom kernel options (one Kconfig/defconfig snippet per line)"
        required: false
        type: string
        default: ""

jobs:
  build-custom-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision || '' }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_ddk: ${{ inputs.use_ddk }}
      use_ntsync: ${{ inputs.use_ntsync || false }}
      use_networking: ${{ inputs.use_networking || false }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      virtualization_support: ${{ inputs.virtualization_support || 'off' }}
      zram_full_algo: ${{ inputs.zram_full_algo || false }}
      zram_extra_algos: ${{ inputs.zram_extra_algos || '' }}
      kpm_password: ${{ inputs.kpm_password || '' }}
      custom_external_modules: ${{ inputs.custom_external_modules || '' }}
      custom_kernel_options: ${{ inputs.custom_kernel_options || '' }}

  get-ksu-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      custom_ref: ${{ inputs.custom_ref || '' }}
