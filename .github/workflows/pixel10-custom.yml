name: Pixel 10 Kernel Build - Custom

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      cpu:
        description: "Pixel 10 CPU Branch"
        required: true
        type: choice
        options:
          - sm8850
          - sm8750
          - sm8735
          - mt6991
          - sm8650
          - mt6989
          - sm8635
          - sm8550
          - sm8450
          - sm8475
          - sm7675
          - sm7635
          - sm7550
          - sm6375
        default: sm8650
      device_manifest:
        description: "ABK Device Config（值为上游 XML 名称，构建摘要会明确显示系统版本）"
        required: true
        type: choice
        options:
          - muzel
        default: muzel
      android_version:
        description: "Kernel Android KMI Version"
        required: true
        type: choice
        options:
          - android16
          - android15
          - android14
          - android13
          - android12
        default: android14
      kernel_version:
        description: "Kernel Version"
        required: true
        type: choice
        options:
          - "6.12"
          - "6.6"
          - "6.1"
          - "5.15"
          - "5.10"
        default: "6.1"
      ksu_variant:
        description: "KernelSU Variant"
        required: true
        type: choice
        options:
          - Official
          - SukiSU
          - ReSukiSU
          - None
        default: SukiSU
      enable_susfs:
        description: "启用 SUSFS（android14/6.1、android15/6.6、android16/6.12）"
        required: false
        type: boolean
        default: false
      use_kpm:
        description: "启用 KPM（仅 SukiSU/ReSukiSU）"
        required: false
        type: boolean
        default: false
      use_lz4kd:
        description: "启用 lz4kd"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 基带防护"
        required: false
        type: boolean
        default: true
      use_bbr:
        description: "启用 BBR"
        required: false
        type: boolean
        default: false
      use_proxy_optimization:
        description: "启用代理相关网络优化（MTK 请关闭）"
        required: false
        type: boolean
        default: true
      use_unicode_bypass:
        description: "启用 Unicode 零宽绕过修复"
        required: false
        type: boolean
        default: false

jobs:
  get-manager:
    name: 上传管理器和 SUSFS 模块
    if: ${{ inputs.ksu_variant != 'None' }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.ksu_variant }}

  build-oneplus-kernel:
    name: "${{ inputs.device_manifest }}-${{ inputs.kernel_version }}-${{ inputs.ksu_variant }}"
    uses: ./.github/workflows/oneplus-build.yml
    secrets: inherit
    with:
      cpu: ${{ inputs.cpu }}
      device_manifest: ${{ inputs.device_manifest }}
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      ksu_variant: ${{ inputs.ksu_variant }}
      enable_susfs: ${{ inputs.enable_susfs }}
      use_kpm: ${{ inputs.use_kpm }}
      use_lz4kd: ${{ inputs.use_lz4kd }}
      use_bbg: ${{ inputs.use_bbg }}
      use_bbr: ${{ inputs.use_bbr }}
      use_proxy_optimization: ${{ inputs.use_proxy_optimization }}
      use_unicode_bypass: ${{ inputs.use_unicode_bypass }}
